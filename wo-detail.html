<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Document · Your All Approval</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/boot.js"></script>
  <script type="module" src="js/pages/wo-detail.js"></script>
</head>

<body class="min-h-screen bg-neutral-50 font-sans text-neutral-900 antialiased">
  <!-- Header, bottom nav and toast are inserted by js/ui.js -->

  <main class="mx-auto max-w-6xl px-4 pb-[calc(7rem_+_env(safe-area-inset-bottom))] pt-6 sm:px-6 sm:pt-10 md:pb-16">

    <a href="dashboard.html" class="inline-flex items-center gap-1 text-sm text-neutral-500 transition hover:text-neutral-900">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      Dashboard
    </a>

    <!-- Not found -->
    <div id="notFound" class="mt-6 hidden rounded-xl border border-dashed border-neutral-300 bg-white px-6 py-14 text-center">
      <p class="text-sm font-medium">Document not found</p>
      <p class="mx-auto mt-1 max-w-xs text-xs leading-relaxed text-neutral-500">It may have been removed when the demo data was reset.</p>
      <a href="dashboard.html" class="mt-4 inline-flex h-9 items-center rounded-lg border border-neutral-300 px-4 text-sm font-medium transition hover:border-neutral-900">Back to dashboard</a>
    </div>

    <!-- Document -->
    <div id="docView" class="hidden">
      <div class="mt-3 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0">
          <div id="docMeta" class="flex flex-wrap items-center gap-2"></div>
          <h1 id="docTitle" class="mt-2 text-2xl font-semibold tracking-tight sm:text-3xl"></h1>
          <p id="docSub" class="mt-1.5 text-sm leading-relaxed text-neutral-600"></p>
        </div>
        <div class="shrink-0 sm:text-right">
          <p class="text-xs text-neutral-500">Total value</p>
          <p id="docTotal" class="tabular mt-0.5 font-mono text-xl font-semibold"></p>
        </div>
      </div>

      <div class="mt-6 grid gap-5 lg:grid-cols-[minmax(0,1fr)_22rem] lg:items-start">
        <div class="min-w-0 space-y-5">
          <section id="stagePanel" class="rounded-xl border border-neutral-200 bg-white" aria-label="Current stage"></section>
          <section id="actionPanel" aria-label="Your action"></section>
          <section id="itemsPanel" class="rounded-xl border border-neutral-200 bg-white" aria-label="Line items"></section>
          <section id="detailsPanel" class="rounded-xl border border-neutral-200 bg-white" aria-label="Details"></section>
        </div>

        <aside class="min-w-0 space-y-5 lg:sticky lg:top-20">
          <section id="stampsPanel" class="rounded-xl border border-neutral-200 bg-white" aria-label="Signatures"></section>
          <section id="timelinePanel" class="rounded-xl border border-neutral-200 bg-white" aria-label="Timeline"></section>
          <details id="payloadPanel" class="group rounded-xl border border-neutral-200 bg-white"></details>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
